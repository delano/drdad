##
# Pre-Commit Hooks Configuration for drdad
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#
# Manual: pre-commit run --all-files

default_install_hook_types:
  - pre-commit
  - prepare-commit-msg

default_stages: [pre-commit]
fail_fast: false

repos:
  # Meta hooks
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-yaml

  # Ruby syntax check for bin scripts
  - repo: local
    hooks:
      - id: ruby-syntax-bin
        name: Ruby Syntax Check (bin/drdad)
        entry: bash -c 'ruby -c bin/drdad'
        language: system
        pass_filenames: false
        files: ^bin/drdad$

  # Commit message issue tracking
  - repo: https://github.com/delano/add-msg-issue-prefix-hook
    rev: v0.0.14-fork
    hooks:
      - id: add-msg-issue-prefix
        stages: [prepare-commit-msg]
        args:
          - '--default='
          - '--pattern=(i18n(?=/)|([a-zA-Z0-9]{0,10}-?[0-9]{1,5}))'
          - '--template=[#{}]'
